# charlie-work operating on itself (Senkichi/charlie-work) — Devin-workers profile.
# Derived from examples/orchestrator.config.devin.yaml; required_checks is empty
# because this repo has no CI workflows yet (merge gates on approved review only).

labels:
  ready: automated-ready

dispatch:
  default_limit: 3
  branch_prefix: agent/issue
  worker_model_tier: capable
  worker_template: worker.md
  # PR #73 (issue #63): global concurrency governor. swe-1-6 empirically tolerates
  # 2 concurrent sessions; 4 tripped the provider message rate limit and killed 3
  # of 4 workers mid-task (2026-07-03). Derived from live sidecar records at each
  # dispatch decision; manual (sidecar-less) launches remain invisible to it.
  max_concurrent_sessions: 2

review:
  max_rework_cycles: 2
  require_tests_or_rationale: true
  require_issue_link: true

auto_merge:
  enabled: true
  strategy: squash
  delete_branch: true
  require_approved_review: true
  # Live since PR #33; matrix names since PR #41 (GitHub reports matrix jobs as
  # "Tests (<os>)"). Verified by doctor against .github/workflows/ci.yml.
  required_checks:
    - Tests (ubuntu-latest)
    - Tests (windows-latest)
    - Lint
  # PR #67 (issue #66): after each ship-it merge, update remaining open agent
  # PRs so they don't rot behind main (PR #61 lost a rework cycle to skew).
  update_open_prs: true

runtime:
  state_dir: .var/charlie-work

devin:
  adapter: devin-shell
  session_manifest: .var/charlie-work/dispatches/session-manifest.json
  session_results: .var/charlie-work/dispatches/session-results.json
  sessions_dir: .var/charlie-work/dispatches/sessions
  # Pin the worker model (PR #54's knob). With no --model flag the Devin CLI
  # defaults to claude-opus-4-8-medium (premium tier) — that burned the entire
  # daily quota in ~19 sessions on 2026-07-03. swe-1-6 is Devin's subsidized
  # proprietary model. Verify with `charlie doctor` (reports effective model).
  worker_model: swe-1-6

cross_family:
  enabled: true
  model: codex
  command:
    - devin
    - --model
    - "{model}"
    - -p
    - --prompt-file
    - "{prompt_path}"
  timeout_seconds: 300
