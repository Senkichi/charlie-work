name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded in-progress runs for the same branch. charlie-work has
# only 2 registered self-hosted runners; without this, a run left in-progress
# by a since-superseded push keeps occupying one of them to test a SHA that
# can no longer appear in any PR's check set (checks are computed against the
# head SHA). Push-to-main runs are exempt from cancellation: a main run is a
# historical record that also feeds deployment, not a superseded draft.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# SELF-HOSTED (2026-07): hosted-runner minutes exhausted mid-month; all jobs
# run on the repo-registered self-hosted runner (cw-9800x3d-1, local Windows
# box). The hosted ubuntu+windows matrix is suspended — restore it from git
# history when returning to GitHub-hosted runners. Check names changed from
# "Tests (ubuntu-latest)"/"Tests (windows-latest)" to "Tests"; the local
# orchestrator.config.yaml auto_merge.required_checks list must match.
#
# enable-cache stays OFF on self-hosted: setup-uv's GitHub-cache mode runs a
# post-job `uv cache prune --ci` that destroys sibling jobs' in-flight cache
# extractions when runners share a box (observed 2026-07-08 on job-cannon).
# The persistent local disk cache is already warm.
jobs:
  Tests:
    name: Tests
    runs-on: self-hosted
    # 35 min: derived from 28 successful runs (2026-07-28/29). Per-job
    # execution time (startedAt->completedAt, excluding runner-queue wait):
    # median 11.5 min, range 3.85-23.72 min. The 23.72 max was a contended
    # run that still passed. 35 clears it by ~48% and catches the
    # pathological 40+ min degraded/orphaned runs observed on this shared
    # box (job-cannon #1440: 40, 51, 86 min). Tests is a required status
    # check, so a spurious timeout wedges merges -- 3x median headroom
    # avoids firing on ordinary contention. Sibling: job-cannon PR #1443.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Run tests
        run: uv run pytest -q --tb=short

  Lint:
    name: Lint
    runs-on: self-hosted
    # 15 min: derived from 28 successful runs (2026-07-28/29). Per-job
    # execution: median 0.37 min (22s), max 0.55 min (33s) -- checkout,
    # setup-uv, uv sync, and both ruff steps combined. Lint is a required
    # status check and trivial work, so a very wide margin (27x median)
    # prevents a spurious timeout from wedging merges while still catching
    # a true wedge vs GitHub's 360-min default. Sibling: job-cannon PR #1443
    # set 10 min on its required aggregate gate (13s healthy).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Ruff check
        run: uv run ruff check --no-cache .
      - name: Ruff format
        run: uv run ruff format --check --no-cache .
