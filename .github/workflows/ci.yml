name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded in-progress runs for the same branch. charlie-work has
# only 2 registered self-hosted runners; without this, a run left in-progress
# by a since-superseded push keeps occupying one of them to test a SHA that
# can no longer appear in any PR's check set (checks are computed against the
# head SHA). Push-to-main runs are exempt from cancellation: a main run is a
# historical record that also feeds deployment, not a superseded draft.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Force UTF-8 on every Python process CI spawns. The self-hosted runner is a
# Windows box where Python resolves its text layer from the ANSI codepage
# (cp1252 on the GitHub runner image), not UTF-8 -- so any test that touches a
# non-ASCII path, fixture, event payload, or subprocess pipe is decoded with
# the wrong codec without this. That asymmetry with the dev box (which sets
# both machine-wide) is the failure mode: a test passes locally and fails only
# in CI, or -- worse -- passes in CI while silently mangling, because a
# mojibaked string is still a string and most assertions never look.
#
# Set BOTH, and keep the ':surrogateescape' suffix. This mirrors
# scripts/fleet-pass.ps1 (lines 62-63), which sets exactly these two variables
# for the live supervisor for the same reason.
#   - PYTHONUTF8=1 also fixes the open() default, which PYTHONIOENCODING does
#     not touch -- the two are not redundant.
#   - A BARE 'utf-8' is actively harmful: it overrides the surrogateescape
#     handlers that UTF-8 mode installs and resets stdin/stdout to 'strict',
#     turning graceful degradation into a hard crash on any not-quite-clean
#     byte off a pipe. Do not shorten. See fleet-pass.ps1:53-60 for the full
#     warning and ~/.claude/docs/utf8-hardening.md for the rationale.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8:surrogateescape"

# Least-privilege default for every job. The Lint job overrides this with its
# own block (it needs pull-requests: read for the closing-keyword gate); a
# job-level permissions key REPLACES the workflow-level one entirely, which is
# why Lint's block lists contents: read again rather than inheriting it.
permissions:
  contents: read

# SELF-HOSTED (2026-07): hosted-runner minutes exhausted mid-month; all jobs
# run on the repo-registered self-hosted runners (a local Windows box). The
# hosted ubuntu+windows matrix is suspended — restore it from git history
# when returning to GitHub-hosted runners. Check names changed from
# "Tests (ubuntu-latest)"/"Tests (windows-latest)" to "Tests"; the local
# orchestrator.config.yaml auto_merge.required_checks list must match.
#
# setup-uv was removed entirely on 2026-08-11 (#1115) in favor of a
# PATH-append step -- see the comment on that step. If it is ever restored,
# enable-cache must stay OFF on self-hosted: its GitHub-cache mode runs a
# post-job `uv cache prune --ci` that destroys sibling jobs' in-flight cache
# extractions when runners share a box (observed 2026-07-08 on a sibling
# repo's pool). The persistent local disk cache is already warm.
jobs:
  Tests:
    name: Tests
    # `suite` is the capacity semaphore for this job (the #1254 follow-up the
    # comment below promised). Only two of this repo's runners carry the custom
    # `suite` label (added 2026-08-22; the sibling repo's pool uses the same
    # split), so at most TWO Tests jobs run at once and the rest QUEUE -- GitHub
    # enforces this by label matching and never cancels a queued job for it.
    # Measured the same day, right after the group below was removed: four Tests
    # jobs landed at once (one per listener) on top of the sibling's suite legs
    # and the dispatch tree, and a suite that runs 7:38 solo at -n 2 took 43.7
    # min, with three siblings at the 45m timeout. Light jobs (Lint) stay on
    # `light`, which every cw listener carries, so they are never queued
    # behind a suite. Labels are registration-side metadata: the allocator
    # starts/parks listeners and never re-registers, so the split survives
    # parking; re-provisioning a runner must re-apply them (ci_fleet #96).
    runs-on: [self-hosted, Windows, X64, suite]
    # NO job-level concurrency group here -- deliberately. PR #1388 (#1254)
    # added `concurrency: {group: cw-tests-self-hosted, cancel-in-progress:
    # false}` to serialize Tests across branches, on the premise that excess
    # jobs would queue. They do not: GitHub keeps at most ONE pending job per
    # concurrency group and CANCELS the older pending job whenever a newer one
    # enters the same group, regardless of cancel-in-progress (that flag only
    # protects the RUNNING job). With a constant group key, every Tests job
    # that was still queued when any other branch's run was created got
    # cancelled with runner_name="" / steps=[] -- 2026-08-22 21:19Z-23:37Z,
    # ~10 PR runs killed, #1389/#1397/#1377 stranded approved-but-unmergeable
    # (issue #1399). The sibling repo's ci.yml header documents the same trap and
    # the correct primitive: a runner LABEL as the capacity semaphore
    # (`runs-on: [self-hosted, ..., suite]` on only N provisioned runners),
    # which the GitHub scheduler enforces by queueing, never cancelling. That
    # is what the `suite` runs-on above now does; the 75m timeout below is the
    # backstop for residual contention, not the bound.
    # 75 min: raised from 45 (#1434). The 45 min value was itself raised
    # from 30 (#1254). 30 was derived from 28 successful runs
    # (2026-07-28/29) with per-job execution time median 11.5 min,
    # range 3.85-23.72 min, and cleared the 23.72 max by ~26%. But on
    # 2026-08-15 four PRs' Tests jobs ran concurrently on the shared
    # self-hosted box alongside other repos' CI and the dispatch tree's
    # pytest sessions; CPU contention stretched a suite that normally
    # finishes in ~8m (-n 2) to 29:43, and the 30m job timeout killed each
    # at the finish line -- the suites PASSED ("4140 passed, 4 skipped in
    # 1783.10s") but the job was cancelled during cleanup, producing false
    # reds. 45 min was ~1.9x the uncontended max (23.72m) and ~1.5x the
    # observed contended runtime (30m) -- enough headroom for residual
    # contention without returning to the 60m budget that let the
    # 2026-08-08 cross-repo incident wedge runners for ~10h.
    #
    # 45 -> 75 (#1434): the `suite` runner-label semaphore (#1404) bounds
    # cw Tests to 2 concurrent, but the host also carries a sibling repo's two
    # `suite` legs plus dispatch-tree pytest sessions. The semaphore
    # comment above records the measured effect: a suite that runs 7:38
    # solo at -n 2 took 43.7 min with three siblings. Healthy runs now
    # take 38-40m (PR #1426: 38m25s pass; PR #1416: 39m58s real failure),
    # so 45m left ~12% headroom and any sustained overlap pushed runs past
    # the cap -- overnight 2026-08-23/24, 9 of 16 completed Tests runs were
    # cap-killed at 45m, each cycling through merge_failed_attempt_alarm.
    # 75 min clears the worst measured contended runtime (43.7m) by ~70%
    # while still catching genuine hangs. Do NOT re-add a job-level
    # concurrency group (see #1399/#1404 header above) or touch the
    # runs-on labels. Sibling repo's equivalent change: its PR #1443.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      # setup-uv@v7 replaced with a PATH-append (#1115): the action's runner
      # Node process crashed twice in 12 min with a libuv assertion
      # (async.c:94, upstream flake class) on this box, and on a self-hosted
      # runner the action's only real job -- downloading uv -- is unnecessary:
      # the tool cache and the host both already have it. Resolution order:
      # newest uv in the runner tool cache (what setup-uv itself installed),
      # else host uv on PATH, else fail loudly -- never silently download.
      - name: Add uv to PATH (self-hosted, no setup-uv)
        shell: bash
        run: |
          set -e
          cache="$RUNNER_TOOL_CACHE/uv"
          dir=""
          if [ -d "$cache" ]; then
            ver=$(ls "$cache" | grep -E '^[0-9]+[.][0-9]+[.][0-9]+$' | sort -V | tail -1)
            [ -n "$ver" ] && dir="$cache/$ver/x64"
          fi
          if [ -n "$dir" ] && [ -x "$dir/uv.exe" ]; then
            echo "$dir" >> "$GITHUB_PATH"
            "$dir/uv.exe" --version
          elif command -v uv >/dev/null; then
            uv --version
          else
            echo "::error::uv not found in tool cache ($cache) or host PATH; install uv on the host"
            exit 1
          fi
      # ci-fleet resolves from PyPI (versioned wheel in uv.lock) since
      # 2026-08-28; the sibling-checkout step that used to live here -- with
      # its PAT, per-run fetch, and "CI validates what production runs"
      # rationale -- is gone because CI and the supervisor now install the
      # same published artifact. Restore from git history only if the
      # dependency ever reverts to an editable path source.
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Run tests
        # -n 2 (pytest-xdist, fixed count -- deliberately not "auto"): this
        # box runs 2 self-hosted runners, so 2 Tests jobs can already execute
        # concurrently, and charlie-work's own worker-dispatch tree can add
        # more pytest sessions on the same shared box independent of CI. That
        # tree's default worker count for its own dispatched sessions is
        # PYTEST_XDIST_AUTO_NUM_WORKERS=2 (src/charlie_work/env_sanitize.py),
        # itself chosen after a 2026-07-26 incident (issue 646) where ~36
        # uncapped xdist workers stacked on this box's 8 physical cores took
        # a 6.4min suite to ~145min. That constant only governs the
        # dispatch tree's own "-n auto" resolution and has no enforcement
        # reach into this workflow file -- but matching its number here
        # keeps this job's box footprint consistent with the rest of the
        # system's box-sharing discipline rather than picking an unrelated,
        # uncoordinated worker count for the one job that also runs
        # concurrently (x2 runners) on the same shared hardware.
        # --dist=load (pytest-xdist's default, spelled out for clarity)
        # rather than loadfile: tests/test_worktree.py alone is ~150 of
        # ~3100 tests and the heaviest file by wall time (real git.exe
        # subprocesses), so pinning it to a single worker would floor the
        # achievable speedup.
        #
        # Measured full-suite, full local run, ambient box load 35-70% (other
        # CI jobs and fleet worktree processes concurrently active -- not an
        # idealized clean-room benchmark) (2026-07-31, this box, all runs
        # identical pass/skip count -- 3092 passed, 2 skipped):
        #   serial:    1593.55s (26:33)
        #   -n 2:       458.86s ( 7:38)  3.47x
        #   -n 4:       457.45s ( 7:37)  3.48x  (measured for comparison,
        #                                        not used -- ties -n 2)
        #   -n 6:       369.76s ( 6:10)  4.31x  (measured for comparison,
        #                                        not used -- see below)
        # -n 2 ties -n 4 and -n 6 is only moderately faster than both; given
        # ambient load varied 35-70% CPU across these runs (uncontrolled,
        # shared box), this spread is consistent with ambient-load noise
        # rather than a clean worker-count scaling curve, so it is not being
        # read as proof the suite is IO-bound past 2 workers. The choice of
        # -n 2 rests on the box-sharing argument above, not on a claimed
        # throughput advantage -- and the data at minimum rules out a large
        # speed cost to the safer, convention-matching count.
        # -q dropped here (pyproject.toml addopts already sets it): stacking
        # an explicit -q on top of addopts' -q silently drops pytest's final
        # "N passed" summary line -- verified locally, exit code is
        # unaffected either way but CI logs become unreadable for a human
        # skimming a pass without failures. Pre-existing on this line before
        # this change; fixed in the same edit rather than left in place.
        run: uv run pytest --tb=short -n 2 --dist=load

  Lint:
    name: Lint
    # `light`: every cw listener carries it, so Lint never waits behind the
    # two-slot `suite` semaphore that bounds Tests (see that job's header).
    runs-on: [self-hosted, Windows, X64, light]
    # 15 min: derived from 28 successful runs (2026-07-28/29). Per-job
    # execution: median 0.37 min (22s), max 0.55 min (33s) -- checkout,
    # setup-uv, uv sync, and both ruff steps combined. Lint is a required
    # status check and trivial work, so a very wide margin (27x median)
    # prevents a spurious timeout from wedging merges while still catching
    # a true wedge vs GitHub's 360-min default. Sibling repo's equivalent change: its PR #1443
    # set 10 min on its required aggregate gate (13s healthy).
    timeout-minutes: 15
    # Explicit permissions block, required by the closing-keyword gate step
    # below: repo default_workflow_permissions is "read", but that does not
    # extend to the PR GraphQL query `gh pr view` issues (GitHub.pr_view in
    # github.py). One live failure on this branch needed a real scope grant:
    #   run 30607061237, job 91081435392: "GraphQL: Resource not accessible
    #   by integration (repository.pullRequest)" -- fixed by adding
    #   pull-requests: read; the PR object itself isn't visible without it.
    # A second failure surfaced a deeper scope, one level down the same
    # query: run 30609781476, job 91089795120: "GraphQL: Resource not
    # accessible by integration (repository.pullRequest.statusCheckRollup
    # .nodes.0.commit.statusCheckRollup)". Rather than chase individual
    # nested-connection scopes field by field, the fix was at the query
    # layer instead: the gate never needed statusCheckRollup at all (it only
    # reads PR title/body/branch), so GitHub.pr_view() now takes an explicit
    # `fields` override and the CLI passes the narrow
    # CLOSING_KEYWORD_PR_FIELDS (github.py) instead of the general-purpose
    # PR_VIEW_FIELDS. checks: read is therefore NOT listed below -- nothing
    # in this job's steps requests a checks-scoped field anymore, so whether
    # checks: read alone would also have resolved failure #2 is moot for
    # this gate either way; least-privilege favors the narrower query over
    # the broader grant regardless.
    # Once ANY explicit permissions: key is set, GitHub treats every
    # unlisted scope as none for this job, so contents: read (needed by
    # actions/checkout@v5) must stay listed alongside pull-requests: read,
    # not just the newly-added scope alone.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      # setup-uv@v7 replaced with a PATH-append (#1115): the action's runner
      # Node process crashed twice in 12 min with a libuv assertion
      # (async.c:94, upstream flake class) on this box, and on a self-hosted
      # runner the action's only real job -- downloading uv -- is unnecessary:
      # the tool cache and the host both already have it. Resolution order:
      # newest uv in the runner tool cache (what setup-uv itself installed),
      # else host uv on PATH, else fail loudly -- never silently download.
      - name: Add uv to PATH (self-hosted, no setup-uv)
        shell: bash
        run: |
          set -e
          cache="$RUNNER_TOOL_CACHE/uv"
          dir=""
          if [ -d "$cache" ]; then
            ver=$(ls "$cache" | grep -E '^[0-9]+[.][0-9]+[.][0-9]+$' | sort -V | tail -1)
            [ -n "$ver" ] && dir="$cache/$ver/x64"
          fi
          if [ -n "$dir" ] && [ -x "$dir/uv.exe" ]; then
            echo "$dir" >> "$GITHUB_PATH"
            "$dir/uv.exe" --version
          elif command -v uv >/dev/null; then
            uv --version
          else
            echo "::error::uv not found in tool cache ($cache) or host PATH; install uv on the host"
            exit 1
          fi
      # ci-fleet resolves from PyPI (versioned wheel in uv.lock) since
      # 2026-08-28; the sibling-checkout step that used to live here -- with
      # its PAT, per-run fetch, and "CI validates what production runs"
      # rationale -- is gone because CI and the supervisor now install the
      # same published artifact. Restore from git history only if the
      # dependency ever reverts to an editable path source.
      - name: Lock currency gate (issue 889)
        # `uv sync --frozen` below consumes uv.lock as-is and deliberately
        # SKIPS the "is this lock still current with pyproject.toml?"
        # assertion. That skip is the hole this closes: a pyproject edit
        # (dependency added, bound changed) without a matching `uv lock`
        # would otherwise ride green through CI and surface later as an
        # unexplained regenerated-lock hunk in an unrelated PR.
        #
        # (The original motivating case -- a [package.metadata.requires-dev]
        # snapshot of the editable ../ci_runners sibling drifting when that
        # repo's dev group changed -- disappeared with the 2026-08-28 switch
        # to the published ci-fleet wheel, but the gate's general form is
        # exactly as cheap and still load-bearing.)
        #
        # Deliberately a step of the existing "Lint" job, and deliberately
        # NOT a `--frozen` -> `--locked` swap on the step below:
        #   * A new job name would need matching edits to required_checks in
        #     BOTH .aviator/config.yml and the deployed
        #     orchestrator.config.yaml. Same reasoning as the
        #     closing-keyword gate: a step changes no check names, so no
        #     downstream consumer has to learn about it.
        #   * Kept separate from `uv sync` so "lock is stale" and "install
        #     failed" cannot collapse into one exit code -- exactly the
        #     ambiguity #888 and #891 were spent pulling back apart.
        #
        # When this fires it fires uniformly: every open PR goes red at once
        # and identically, which reads as a clock/merge-class signal rather
        # than a branch defect. The fix is one command -- `uv lock`, commit.
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Ruff check
        run: uv run ruff check --no-cache .
      - name: Ruff format
        run: uv run ruff format --check --no-cache .
      - name: Closing-keyword gate (issue 790)
        # PR-only: push-to-main has no PR number, and GitHub's native
        # auto-close scan only ever runs against a PR's body + commits.
        #
        # Deliberately a step of the existing "Lint" job, not a new job:
        # GitHub reports check-run status per JOB, not per step, so this
        # rides the already-required "Lint" context and becomes a de facto
        # blocking gate the moment a PR branch includes this workflow
        # change -- no branch-protection edit, no orchestrator.config.yaml
        # or .aviator/config.yml change, no separate promotion step at all.
        # pull_request-triggered workflows run the version of ci.yml on the
        # PR's own head branch, so a PR branch cut before this merges simply
        # has no such step yet and is unaffected -- nothing is stranded.
        #
        # Scans the PR body and every commit message for a closing keyword
        # (close(s/d)/fix(es/ed)/resolve(s/d)) bound to an issue number other
        # than this PR's own declared target -- the surface GitHub's native
        # auto-close-on-merge scans, which has no negation awareness at all.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run charlie closing-keyword-check --pr ${{ github.event.pull_request.number }}
      - name: Mojibake gate (issue 1057)
        # PR-only: push-to-main has no diff to scan (the branch IS main).
        #
        # Same structural rationale as the closing-keyword gate above: a
        # step of the existing "Lint" job, not a new job, so it rides the
        # already-required "Lint" context and becomes a de facto blocking
        # gate the moment a PR branch includes this workflow change -- no
        # branch-protection edit, no orchestrator.config.yaml or
        # .aviator/config.yml change, no separate promotion step.
        #
        # Scans added lines in the PR diff for cp1252/UTF-8 mojibake --
        # non-ASCII characters corrupted by a misconfigured editing path
        # (e.g. em-dashes turned into the a-circumflex/euro/quote sequence).
        # The detection is derived from the encoding process (reverse the
        # corruption and check whether the result differs), not a hardcoded
        # list of bad byte sequences, so it catches any UTF-8/cp1252 round
        # trip. See src/charlie_work/mojibake_gate.py for the full rationale.
        #
        # The base SHA is the PR's base branch tip at the time of the run,
        # available in the workflow event context. actions/checkout@v5 with
        # its default fetch-depth: 1 creates a shallow clone that contains
        # only the PR head -- the base SHA is absent, so `git diff` against
        # it exits 128 ("fatal: bad revision"). We fetch the base SHA
        # explicitly (--depth 1: just that commit, no history) before
        # running the gate.
        #
        # The gate uses a two-dot diff (base..HEAD), not three-dot
        # (base...HEAD): three-dot needs the merge-base of base and HEAD,
        # which requires traversing history between them -- impossible in a
        # shallow clone where both endpoints are present but the ancestry
        # chain is cut. Two-dot compares the two trees directly (no
        # merge-base computation) and works in a shallow clone once both
        # commits are present. For a PR that is up-to-date with its base
        # (mergeable, the common case) the two are equivalent; for a PR
        # that is behind, two-dot scans a superset of the PR's own added
        # lines, which is safe for a corruption gate -- a false positive
        # would mean the base branch itself has mojibake, which is a real
        # problem worth surfacing.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth 1 origin ${{ github.event.pull_request.base.sha }}
          if ($LASTEXITCODE -ne 0) { throw "git fetch of base SHA failed" }
          uv run charlie mojibake-check --base ${{ github.event.pull_request.base.sha }}
