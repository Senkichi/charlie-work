name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # One nightly per repo (program ruling R4). Sub-projects 4 and 5 attach to
  # this run; this job set refreshes the pytest-split durations cache.
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

# Cancel superseded in-progress runs for the same branch. A run left
# in-progress by a since-superseded push is testing a SHA that can no longer
# appear in any PR's check set (checks are computed against the head SHA), so
# it is pure noise. The self-hosted era added a capacity argument on top (2
# registered runners); on hosted runners capacity is not scarce, but the
# hygiene argument stands on its own. Push-to-main runs are exempt from
# cancellation: a main run is a historical record that also feeds deployment,
# not a superseded draft.
# Schedule runs get their own group: GitHub keeps one PENDING run per group and
# cancels the older pending one, so a nightly sharing main's group could be
# cancelled by a push that arrives while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'ci' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Force UTF-8 on every Python process CI spawns. The hosted windows-latest
# image is a Windows box where Python resolves its text layer from the ANSI
# codepage (cp1252 on the GitHub runner image), not UTF-8 -- so any test that
# touches a non-ASCII path, fixture, event payload, or subprocess pipe is
# decoded with the wrong codec without this. That asymmetry with the dev box
# (which sets both machine-wide) is the failure mode: a test passes locally
# and fails only in CI, or -- worse -- passes in CI while silently mangling,
# because a mojibaked string is still a string and most assertions never look.
#
# Set BOTH, and keep the ':surrogateescape' suffix. This mirrors the
# $env:PYTHONUTF8 / $env:PYTHONIOENCODING assignments in
# scripts/fleet-pass.ps1, which set exactly these two variables for the live
# supervisor for the same reason.
#   - PYTHONUTF8=1 also fixes the open() default, which PYTHONIOENCODING does
#     not touch -- the two are not redundant.
#   - A BARE 'utf-8' is actively harmful: it overrides the surrogateescape
#     handlers that UTF-8 mode installs and resets stdin/stdout to 'strict',
#     turning graceful degradation into a hard crash on any not-quite-clean
#     byte off a pipe. Do not shorten. See the "Set BOTH, and keep the
#     ':surrogateescape' suffix" block in scripts/fleet-pass.ps1 for the full
#     warning.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8:surrogateescape"

# Least-privilege default for every job. The Lint job overrides this with its
# own block (it needs pull-requests: read for the closing-keyword gate); a
# job-level permissions key REPLACES the workflow-level one entirely, which is
# why Lint's block lists contents: read again rather than inheriting it.
permissions:
  contents: read

# HOSTED (2026-08-28): GitHub-hosted runners, STANDARD images only
# (windows-latest, ubuntu-latest). Larger-runner labels bill even on public
# repos -- never use them.
#
# Required check names are "Lint", "Tests" and "Collect-only gate"
# (.aviator/config.yml, orchestrator.config.yaml, branch protection). Since
# DD-4 the suite runs in the `tests-shard` matrix ("Tests shard k/n",
# never required) and the job named exactly "Tests" is an aggregate over it,
# so the required name did not change. Renaming "Tests" or making it a matrix
# is still a coordinated three-place change, never a workflow-only edit.
jobs:
  coverage:
    name: Detect coverage
    # Plans the shard matrix (CI_TEST_SHARDS, R14: never the selector's
    # fraction) on every event, and (DD-5) classifies covered pushes.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      splits: ${{ steps.plan.outputs.splits }}
      shard_timeout: ${{ steps.plan.outputs.shard_timeout }}
      covered: ${{ steps.covered.outputs.covered }}
    steps:
      - name: Plan shards
        id: plan
        # CI_TEST_SHARDS unset -> SHARDS_DEFAULT; clamped to 1..20. The shard
        # timeout is computed: 30 min for <= 2 shards (the old single-job
        # bound; a 1-shard kill-switch run is the whole ~21-min suite), else
        # 15. Lower SHARDS_DEFAULT here when ci-dedup check A6 files an issue.
        shell: bash
        env:
          SHARDS_VAR: ${{ vars.CI_TEST_SHARDS }}
          SHARDS_DEFAULT: "6"
        run: |
          set -euo pipefail
          n="${SHARDS_VAR:-}"
          case "$n" in ''|*[!0-9]*) n="$SHARDS_DEFAULT";; esac
          n=$((10#$n))
          [ "$n" -ge 1 ] || n=1
          [ "$n" -le 20 ] || n=20
          if [ "$n" -le 2 ]; then t=30; else t=15; fi
          {
            echo "shards=[$(seq -s, 1 "$n")]"
            echo "splits=$n"
            echo "shard_timeout=$t"
          } >> "$GITHUB_OUTPUT"
          echo "shards=$n shard_timeout=$t"

      - name: Classify covered push
        id: covered
        # covered=true only for a push whose merge commit was made by the
        # merge-queue bot: the suite already ran on the queue's draft PR.
        # Two REST calls (commits/{sha}/pulls has no merged_by). Every error
        # path emits covered=false, so a fault costs a redundant run, never
        # a skipped one. GraphQL reports bot logins without "[bot]"; both
        # sides are compared with the suffix stripped.
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SKIP_COVERED: ${{ vars.CI_SKIP_COVERED_PUSH }}
          BOT_LOGIN: ${{ vars.MERGE_QUEUE_BOT_LOGIN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          out="${GITHUB_OUTPUT:?}"; bot="${BOT_LOGIN:-}"; [ -n "$bot" ] || bot="aviator-app[bot]"
          emit() { echo "covered=$1" >> "$out"; echo "covered=$1 ($2)"; exit 0; }
          [ "${EVENT_NAME:-}" = "push" ] || emit false "event not push"
          [ "${SKIP_COVERED:-}" != "false" ] || emit false "kill switch"
          [ -n "${REPO:-}" ] && [ -n "${SHA:-}" ] || emit false "REPO or SHA unset"
          pr="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq "[.[] | select(.merge_commit_sha == \"$SHA\")][0].number // empty" 2>/dev/null)" || emit false "lookup failed"
          [ -n "$pr" ] || emit false "no PR"; case "$pr" in *[!0-9]*) emit false "bad pr";; esac
          login="$(gh api "repos/$REPO/pulls/$pr" --jq '.merged_by.login // empty' 2>/dev/null)" || emit false "PR lookup failed"
          [ "${login%"[bot]"}" = "${bot%"[bot]"}" ] && emit true "merged by $login"; emit false "merged by ${login:-nobody}"

  tests-shard:
    name: Tests shard ${{ matrix.group }}/${{ needs.coverage.outputs.splits }}
    needs: coverage
    if: needs.coverage.outputs.covered != 'true'
    # NO job-level concurrency group (#1399; pinned by tests/test_issue_1254.py).
    runs-on: windows-latest
    timeout-minutes: ${{ fromJSON(needs.coverage.outputs.shard_timeout) }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.coverage.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
      # SHA-pinned setup-uv, enable-cache left at `auto` (see the git history
      # of this file for the 2026-08-28 rationale).
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Restore test durations
        # Saved by the nightly `schedule` run on main (ubuntu), restored here
        # on windows: enableCrossOsArchive on both sides. A miss is fine:
        # pytest-split weighs unknown tests equally (balance, not correctness).
        uses: actions/cache/restore@v4
        with:
          path: .test_durations
          key: test-durations-${{ github.run_id }}
          restore-keys: test-durations-
          enableCrossOsArchive: true
      - name: Run test shard
        # duration_based_chunks keeps collection order, so each shard is a
        # contiguous run of files (module/class fixtures stay local).
        # -n auto / --dist=load as before (2 workers on windows-latest).
        # --store-durations only on the nightly; -q comes from addopts.
        shell: bash
        env:
          SPLITS: ${{ needs.coverage.outputs.splits }}
          GROUP: ${{ matrix.group }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          store=""
          if [ "$EVENT_NAME" = "schedule" ]; then store="--store-durations"; fi
          uv run pytest --tb=short -n auto --dist=load \
            --splits "$SPLITS" --group "$GROUP" \
            --splitting-algorithm duration_based_chunks \
            --durations-path .test_durations $store \
            --junit-xml="pytest-junit-$GROUP.xml"
      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-${{ matrix.group }}
          path: pytest-junit-${{ matrix.group }}.xml
          if-no-files-found: ignore
          retention-days: 7
      # The test ledger (ci-fleet, LG-C1a; moved here from the old `Tests` job by
      # DD-4): this shard's recorder spool under RUNNER_TEMP. Ledger S1 artifact.
      # Never allowed to change the job's result.
      - name: Upload test-ledger spool
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-fleet-ledger-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-fleet-ledger/
          retention-days: 3
          if-no-files-found: ignore
      - name: Upload durations
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: durations-${{ matrix.group }}
          path: .test_durations
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  Tests:
    name: Tests
    # The required "Tests" check: an aggregate over the shard matrix.
    needs: [coverage, collect-only-gate, tests-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - name: Decide verdict
        id: verdict
        # needs.tests-shard.result is one value for the whole matrix, so the
        # per-shard conclusions come from the jobs API for this attempt.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHARD_RESULT: ${{ needs.tests-shard.result }}
          GATE_RESULT: ${{ needs.collect-only-gate.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          COVERED: ${{ needs.coverage.outputs.covered }}
          SPLITS: ${{ needs.coverage.outputs.splits }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | [.name, .conclusion] | @json' > jobs.jsonl
          python3 scripts/ci_tests_verdict.py --jobs jobs.jsonl \
            --shard-result "$SHARD_RESULT" --gate-result "$GATE_RESULT" \
            --coverage-result "$COVERAGE_RESULT" --covered "${COVERED:-false}" \
            --splits "${SPLITS:-0}" >> "$GITHUB_OUTPUT"
      - name: Cancel run on infrastructure fault
        # Ends "Tests" as `cancelled`, which charlie-work's #841 infra-rerun
        # path classifies as infra (an aggregate `failure` would dispatch a
        # code-fix rework for an infrastructure fault).
        if: steps.verdict.outputs.verdict == 'cancel'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run cancel "$RUN_ID" --repo "$REPO"
          sleep 120
          exit 1
      - name: Download shard junit
        if: steps.verdict.outputs.verdict != 'cancel' && needs.coverage.outputs.covered != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-junit-*
          merge-multiple: true
          path: junit
      - name: Download head collection
        if: steps.verdict.outputs.verdict != 'cancel' && needs.coverage.outputs.covered != 'true'
        uses: actions/download-artifact@v4
        with:
          name: head-collect
          path: .
      - name: Annotate failed tests
        if: steps.verdict.outputs.verdict == 'fail'
        shell: bash
        run: python3 scripts/ci_junit_annotations.py --root . junit/*.xml
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: steps.verdict.outputs.verdict != 'cancel' && needs.coverage.outputs.covered != 'true'
      - name: Install dependencies
        if: steps.verdict.outputs.verdict != 'cancel' && needs.coverage.outputs.covered != 'true'
        run: uv sync --frozen --all-extras
      - name: Recorded-vs-collected check (issue #1621)
        # Sum of every shard's junit <testcase> count must equal the head
        # collection count, and no test may appear in two shards. Runs even
        # when the verdict is `fail`: a truncated junit must not hide behind
        # a test failure.
        if: steps.verdict.outputs.verdict != 'cancel' && needs.coverage.outputs.covered != 'true'
        shell: bash
        run: |
          uv run charlie junit-recorded-check \
            --junit 'junit/pytest-junit-*.xml' \
            --collect head_collect.txt
      - name: Fail on shard failure
        if: steps.verdict.outputs.verdict == 'fail'
        shell: bash
        env:
          REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          echo "::error title=Tests::$REASON"
          exit 1
      - name: Restore test durations baseline
        if: github.event_name == 'schedule' && steps.verdict.outputs.verdict == 'pass'
        uses: actions/cache/restore@v4
        with:
          path: .test_durations
          key: test-durations-${{ github.run_id }}
          restore-keys: test-durations-
          enableCrossOsArchive: true
      - name: Download shard durations
        if: github.event_name == 'schedule' && steps.verdict.outputs.verdict == 'pass'
        uses: actions/download-artifact@v4
        with:
          pattern: durations-*
          path: durations
      - name: Merge test durations
        if: github.event_name == 'schedule' && steps.verdict.outputs.verdict == 'pass'
        shell: bash
        run: |
          python3 scripts/merge_test_durations.py --baseline .test_durations \
            --out .test_durations durations/*/.test_durations
      - name: Save test durations
        if: github.event_name == 'schedule' && steps.verdict.outputs.verdict == 'pass'
        uses: actions/cache/save@v4
        with:
          path: .test_durations
          key: test-durations-${{ github.run_id }}
          enableCrossOsArchive: true

  Lint:
    name: Lint
    # windows-latest, matching Tests. Everything in this job is
    # platform-flexible in principle (ruff, uv, the two charlie gates), but
    # the dependency set and toolchain have only ever been validated on
    # Windows, and Lint is a required check -- moving it to ubuntu-latest is
    # a cheap follow-up experiment AFTER the hosted move is proven, not a
    # second variable to bundle into the same change that swaps the runner
    # fleet.
    runs-on: windows-latest
    # 15 min: derived from 28 successful self-hosted runs (median 22s, max
    # 33s of execution). Hosted adds VM provisioning and download variance
    # but stays far under this; Lint is a required check, so a wide margin
    # prevents a spurious timeout from wedging merges while still catching a
    # true wedge vs GitHub's 360-min default.
    timeout-minutes: 15
    # Explicit permissions block, required by the closing-keyword gate step
    # below: repo default_workflow_permissions is "read", but that does not
    # extend to the PR GraphQL query `gh pr view` issues (GitHub.pr_view in
    # github.py). One live failure on this branch needed a real scope grant:
    #   run 30607061237, job 91081435392: "GraphQL: Resource not accessible
    #   by integration (repository.pullRequest)" -- fixed by adding
    #   pull-requests: read; the PR object itself isn't visible without it.
    # A second failure surfaced a deeper scope, one level down the same
    # query: run 30609781476, job 91089795120: "GraphQL: Resource not
    # accessible by integration (repository.pullRequest.statusCheckRollup
    # .nodes.0.commit.statusCheckRollup)". Rather than chase individual
    # nested-connection scopes field by field, the fix was at the query
    # layer instead: the gate never needed statusCheckRollup at all (it only
    # reads PR title/body/branch), so GitHub.pr_view() now takes an explicit
    # `fields` override and the CLI passes the narrow
    # CLOSING_KEYWORD_PR_FIELDS (github.py) instead of the general-purpose
    # PR_VIEW_FIELDS. checks: read is therefore NOT listed below -- nothing
    # in this job's steps requests a checks-scoped field anymore, so whether
    # checks: read alone would also have resolved failure #2 is moot for
    # this gate either way; least-privilege favors the narrower query over
    # the broader grant regardless.
    # Once ANY explicit permissions: key is set, GitHub treats every
    # unlisted scope as none for this job, so contents: read (needed by
    # actions/checkout@v5) must stay listed alongside pull-requests: read,
    # not just the newly-added scope alone.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      # setup-uv restored 2026-08-28 -- see the Tests job's step comment for
      # why both #1115 removal reasons were self-hosted-specific, why the
      # SHA pin, and why enable-cache stays at its `auto` default.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Lock currency gate (issue 889)
        # `uv sync --frozen` below consumes uv.lock as-is and deliberately
        # SKIPS the "is this lock still current with pyproject.toml?"
        # assertion. That skip is the hole this closes: a pyproject edit
        # (dependency added, bound changed) without a matching `uv lock`
        # would otherwise ride green through CI and surface later as an
        # unexplained regenerated-lock hunk in an unrelated PR.
        #
        # Deliberately a step of the existing "Lint" job, and deliberately
        # NOT a `--frozen` -> `--locked` swap on the step below:
        #   * A new job name would need matching edits to required_checks in
        #     BOTH .aviator/config.yml and the deployed
        #     orchestrator.config.yaml. Same reasoning as the
        #     closing-keyword gate: a step changes no check names, so no
        #     downstream consumer has to learn about it.
        #   * Kept separate from `uv sync` so "lock is stale" and "install
        #     failed" cannot collapse into one exit code -- exactly the
        #     ambiguity #888 and #891 were spent pulling back apart.
        #
        # When this fires it fires uniformly: every open PR goes red at once
        # and identically, which reads as a clock/merge-class signal rather
        # than a branch defect. The fix is one command -- `uv lock`, commit.
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Ruff check
        run: uv run ruff check --no-cache .
      - name: Ruff format
        run: uv run ruff format --check --no-cache .
      - name: Closing-keyword gate (issue 790)
        # PR-only: push-to-main has no PR number, and GitHub's native
        # auto-close scan only ever runs against a PR's body + commits.
        #
        # Deliberately a step of the existing "Lint" job, not a new job:
        # GitHub reports check-run status per JOB, not per step, so this
        # rides the already-required "Lint" context and becomes a de facto
        # blocking gate the moment a PR branch includes this workflow
        # change -- no branch-protection edit, no orchestrator.config.yaml
        # or .aviator/config.yml change, no separate promotion step at all.
        # pull_request-triggered workflows run the version of ci.yml on the
        # PR's own head branch, so a PR branch cut before this merges simply
        # has no such step yet and is unaffected -- nothing is stranded.
        #
        # Scans the PR body and every commit message for a closing keyword
        # (close(s/d)/fix(es/ed)/resolve(s/d)) bound to an issue number other
        # than this PR's own declared target -- the surface GitHub's native
        # auto-close-on-merge scans, which has no negation awareness at all.
        #
        # Shells out to `gh` via github.py: gh is preinstalled on hosted
        # runner images and reads GH_TOKEN from the environment -- no gh
        # auth state is assumed from the host.
        #
        # Aviator MergeQueue parallel mode skip: aviator-app[bot] opens a
        # combined draft PR (an `mq-bot-*` head branch) whose body/commits
        # union every queued PR's own commits. linked_issue_number() cannot
        # bind that combo branch to a single issue (no `agent/issue-*`
        # prefix match, no single-issue closing keyword in Aviator's own
        # title/body), so intended_issue_number resolves to None and every
        # queued PR's own legitimate closing keyword gets flagged as
        # unexpected -- a guaranteed false-positive failure, not a real
        # risk: each constituent PR already passed this exact gate on its
        # own branch before Aviator queued it. Skip by PR author rather
        # than branch-name pattern -- author is stable regardless of
        # Aviator's internal branch-naming, and matches the same
        # queue_bot_login-authored-PR exclusion reconcile.py/
        # helpers_merge_gate.py already use fleet-wide (issue-linked PR
        # #1934 salvage work).
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'aviator-app[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run charlie closing-keyword-check --pr ${{ github.event.pull_request.number }}
      - name: Mojibake gate (issue 1057)
        # PR-only: push-to-main has no diff to scan (the branch IS main).
        #
        # Same structural rationale as the closing-keyword gate above: a
        # step of the existing "Lint" job, not a new job, so it rides the
        # already-required "Lint" context and becomes a de facto blocking
        # gate the moment a PR branch includes this workflow change -- no
        # branch-protection edit, no orchestrator.config.yaml or
        # .aviator/config.yml change, no separate promotion step.
        #
        # Scans added lines in the PR diff for cp1252/UTF-8 mojibake --
        # non-ASCII characters corrupted by a misconfigured editing path
        # (e.g. em-dashes turned into the a-circumflex/euro/quote sequence).
        # The detection is derived from the encoding process (reverse the
        # corruption and check whether the result differs), not a hardcoded
        # list of bad byte sequences, so it catches any UTF-8/cp1252 round
        # trip. See src/charlie_work/mojibake_gate.py for the full rationale.
        #
        # The base SHA is the PR's base branch tip at the time of the run,
        # available in the workflow event context. actions/checkout@v5 with
        # its default fetch-depth: 1 creates a shallow clone that contains
        # only the PR head -- the base SHA is absent, so `git diff` against
        # it exits 128 ("fatal: bad revision"). We fetch the base SHA
        # explicitly (--depth 1: just that commit, no history) before
        # running the gate.
        #
        # The gate uses a two-dot diff (base..HEAD), not three-dot
        # (base...HEAD): three-dot needs the merge-base of base and HEAD,
        # which requires traversing history between them -- impossible in a
        # shallow clone where both endpoints are present but the ancestry
        # chain is cut. Two-dot compares the two trees directly (no
        # merge-base computation) and works in a shallow clone once both
        # commits are present. For a PR that is up-to-date with its base
        # (mergeable, the common case) the two are equivalent; for a PR
        # that is behind, two-dot scans a superset of the PR's own added
        # lines, which is safe for a corruption gate -- a false positive
        # would mean the base branch itself has mojibake, which is a real
        # problem worth surfacing.
        #
        # shell: bash is explicit (with `set -e` so a failed fetch fails the
        # step): the previous version used PowerShell syntax and relied on
        # the self-hosted Windows runner's default shell -- an implicit
        # runner-OS dependency this step no longer carries.
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -e
          git fetch --depth 1 origin ${{ github.event.pull_request.base.sha }}
          uv run charlie mojibake-check --base ${{ github.event.pull_request.base.sha }}
      - name: Private-slug ratchet gate (issue 1502)
        # PR-only: push-to-main has no diff to scan (the branch IS main).
        #
        # Same structural rationale as the mojibake gate above: a step of
        # the existing "Lint" job, not a new job, so it rides the
        # already-required "Lint" context and becomes a de facto blocking
        # gate the moment a PR branch includes this workflow change -- no
        # branch-protection edit, no orchestrator.config.yaml or
        # .aviator/config.yml change, no separate promotion step.
        #
        # Fails when a PR adds net-new mentions of configured private
        # sibling-repo slugs in tracked files, ratchet-style against
        # .private-slug-baseline/ (issue #1802: per-entry .count files, so
        # concurrent PRs touching different entries merge cleanly instead of
        # conflicting on a shared JSON document). The slug list is config
        # (marker files under .private-slug-baseline/slugs/), not hardcoded
        # in the check body. Moves (remove + add) produce zero net-new and
        # do not trigger the gate. A PR that intentionally adds new mentions
        # must raise the matching files/*.count entries by at least the
        # net-new count -- that bump is tamper-evident in diff review and
        # derived from the diff itself (no stored total). See
        # src/charlie_work/private_slug_gate.py for the full rationale.
        #
        # The base SHA is already fetched by the mojibake gate step above
        # (same job, same fetch). shell: bash with set -e for the same
        # reason as the mojibake gate.
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -e
          uv run charlie private-slug-check --base ${{ github.event.pull_request.base.sha }}
      - name: AST-equivalence gate (issue 1541)
        # PR-only: push-to-main has no diff to scan (the branch IS main).
        #
        # Same structural rationale as the mojibake/private-slug gates above:
        # a step of the existing "Lint" job, not a new job, so it rides the
        # already-required "Lint" context. No branch-protection edit, no
        # orchestrator.config.yaml or .aviator/config.yml change, no separate
        # promotion step.
        #
        # This gate is EVIDENCE, NOT ENFORCEMENT (graft C, #1538): the
        # review packet it renders is advisory for the human reviewer.
        # Enforcement stays in the required_checks list. The step always
        # exits 0 (the gate command returns ok=True unconditionally) -- it
        # only produces a step summary + stdout for the reviewer to read.
        #
        # Detects symbols moved between files in the PR diff and verifies
        # each is a verbatim relocation by comparing
        # ast.dump(node, include_attributes=False) at base vs head. Also
        # runs a vulture stale-shim sweep against any --shim-file args.
        # See src/charlie_work/ast_equivalence_gate.py for the full
        # rationale, including the diff-derived moved-symbol set (graft E,
        # rule #9) and the self-proving requirement (graft G).
        #
        # The base SHA is already fetched by the mojibake gate step above
        # (same job, same fetch). shell: bash with set -e for the same
        # reason as the mojibake gate.
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -e
          uv run charlie ast-equivalence-check --base ${{ github.event.pull_request.base.sha }}

  collect-only-gate:
    name: Collect-only gate
    # Runs on every event: the head collection is uploaded as `head-collect`
    # for the "Tests" aggregate's recorded-vs-collected check (DD-4).
    # The base collection and the comparison stay PR-only (a push or the
    # nightly has no base to compare against).
    #
    # UNLIKE the mojibake/private-slug/ast-equivalence gates (steps of the
    # existing "Lint" job, riding the already-required "Lint" context), this
    # gate is a SEPARATE JOB with its own required-check name. The issue
    # (#1538) explicitly requires the new job's name to be added to
    # required_checks in .aviator/config.yml, the deployed
    # orchestrator.config.yaml, and Aviator's external required-checks config
    # -- a coordinated three-place change. A step of an existing job would
    # avoid the three-place change but would also make the gate advisory (it
    # would ride "Lint"'s required-check context, not its own), which defeats
    # the gate's purpose: it is ENFORCEMENT, not evidence (unlike the
    # AST-equivalence gate, #1541, which is evidence-only and always exits 0).
    #
    # The gate compares leaf-name multisets (function name + class name(s) +
    # parametrize id, module-path stripped) from `pytest --collect-only`
    # output at base and head. A verbatim test relocation (same leaf name,
    # different module path) passes; a rename, addition, deletion, or
    # class-wrapping dodge does not. See src/charlie_work/collect_only_gate.py
    # for the full rationale, including graft K (the leaf-name multiset fix)
    # and graft E (diff-derived inputs, never hand-typed).
    #
    # Issue #1686: the gate step queries the PR's LIVE labels for the
    # operator exemption (`collect-gate-exempt` by default), so this job
    # needs pull-requests: read for the `gh pr view` GraphQL query -- same
    # scope the closing-keyword gate's Lint step needed (see that step's
    # comment for the "Resource not accessible by integration" history).
    # contents: read stays listed because ANY explicit job-level
    # permissions: key makes every unlisted scope `none`, and
    # actions/checkout@v5 still needs it.
    runs-on: windows-latest
    timeout-minutes: 30
    needs: coverage
    if: needs.coverage.outputs.covered != 'true'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Issue #2123: depth 2 so HEAD^1 (the merge ref's base parent) exists.
          fetch-depth: 2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Collect tests at head
        # Capture stdout (node IDs) to a file. `|| true` prevents the step
        # from failing on collection errors -- the gate command will detect
        # a failed collection from the output (no node IDs) and fail with a
        # clear message instead of a bare CI step failure. stderr (warnings,
        # errors) goes to the CI log for diagnostics.
        #
        # NOTE: ``--collect-only`` WITHOUT ``-q``. In pytest >= 8, ``-q``
        # changes the output to a compact ``file: count`` format that does
        # not include individual node IDs -- the gate cannot extract leaf
        # names from that format. The issue (#1538) says ``--collect-only
        # -q`` because it was written against an older pytest where ``-q``
        # still produced one-node-ID-per-line; this repo's pytest (9.x in
        # uv.lock) changed that. ``--collect-only`` (no ``-q``) produces the
        # one-node-ID-per-line format the gate's parser expects.
        #
        # `shell: bash`: the `|| true` idiom is bash, not PowerShell. On
        # windows-latest the default shell is pwsh, where `||` works (pwsh 7)
        # but `true` is not a recognised command -- a collection failure
        # would run `true`, fail to find it, and turn the step red instead of
        # staying green for the gate to surface a clear finding. Bash is
        # always available on GitHub-hosted Windows runners (Git Bash).
        shell: bash
        # -n0: addopts carries -n auto, and collection must stay in-process so the
        # output keeps its "path: count" / nodeid shape. Never -p no:xdist: it
        # unregisters -n and pytest exits "unrecognized arguments: -n".
        run: uv run pytest --collect-only -n0 > head_collect.txt || true
      - name: Upload head collection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: head-collect
          path: head_collect.txt
          retention-days: 7
      - name: Collect tests at base
        if: github.event_name == 'pull_request'
        # Create a git worktree at the base ref, sync deps, and run
        # collect-only there. The worktree is cleaned up in the same step
        # (a `finally`-style trap + `git worktree remove --force`).
        #
        # The collection runs in a SUBSHELL `( ... )`, not a bare `cd`:
        # the EXIT trap fires with the shell's cwd wherever the script left
        # it. A `cd ./base-tree` in the script body would leave the cwd
        # inside the worktree, where the trap's relative `./base-tree`
        # resolves to `base-tree/base-tree` and git exits 128
        # ("fatal: './base-tree' is not a working tree" -- run 35256210708).
        # With the subshell the parent shell's cwd never leaves the
        # workspace root, so the relative path in the trap resolves
        # correctly on both the success and failure paths.
        #
        # `uv sync` in the base worktree creates its own .venv from the
        # shared uv cache -- fast (seconds) on a hosted runner with a warm
        # cache. The alternative (sharing the head .venv via
        # UV_PROJECT_ENVIRONMENT) would avoid the second sync but requires
        # an env var that run_captured does not support; the second sync is
        # the simpler, more robust choice.
        #
        # Same ``--collect-only`` (no ``-q``) note as the head step above.
        shell: bash
        run: |
          set -e
          # Issue #2123: HEAD is refs/pull/N/merge; collect the base side at its
          # first parent (the exact base the head was merged onto), NOT
          # pull_request.base.sha, which can predate PRs merged since. The script
          # exits non-zero unless HEAD is a two-parent merge commit.
          BASE_SHA=$(python scripts/collect_gate_base_sha.py)
          git worktree add ./base-tree "$BASE_SHA"
          trap 'git worktree remove --force ./base-tree' EXIT
          (
            cd ./base-tree
            uv sync --frozen --all-extras
            # -n0: addopts carries -n auto; keep collection in-process. Never
            # -p no:xdist (unregisters -n -> "unrecognized arguments: -n").
            uv run pytest --collect-only -n0 > ../base_collect.txt || true
          )
      - name: Run collect-only gate
        if: github.event_name == 'pull_request'
        # The gate command reads the two collect files and runs the pure
        # comparison logic. It exits non-zero (fails the required check)
        # when a leaf was removed, a removed leaf did not reappear in a
        # sibling under tests/, or a leaf's multiplicity shrank (the issue's
        # Scope table); `added` leaves and grown multiplicities are reported
        # but pass.
        #
        # `shell: bash`: the multi-line `run: |` block uses bash `\` line
        # continuations, which pwsh cannot parse -- a `\` at end of line is a
        # literal backslash, not a continuation, so pwsh sees `--base-collect`
        # on the next line as a bare unary `--` operator and throws
        # ParserError (the #1624 CI failure, reproduced on this job's first
        # run -- 35260669565). Bash is always available on GitHub-hosted
        # Windows runners (Git Bash).
        #
        # Issue #1686: `--pr` hands the gate the PR number so it can query
        # the PR's LIVE labels via `gh pr view` (never the
        # github.event.pull_request.labels snapshot -- a label applied to
        # waive findings must take effect on RERUN without a new push, and
        # a label removed must stop waiving immediately). The job still
        # runs to completion either way -- no step-level `if:` skips on
        # label presence. With the label present the gate prints every
        # waived finding and exits 0; without it, nothing about the
        # #1538 verdict changes. A failed label query fails closed.
        # GH_TOKEN feeds the `gh` CLI inside the gate command -- same
        # env-wiring as the closing-keyword gate step in the Lint job.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run charlie collect-only-check \
            --base-collect base_collect.txt \
            --head-collect head_collect.txt \
            --pr ${{ github.event.pull_request.number }}
