name: Attachment Contracts

on:
  pull_request:
  push:
    branches:
      - main

# Same rationale as ci.yml's concurrency block: charlie-work has only 2
# registered self-hosted runners, so a superseded run must not keep one
# occupied testing a SHA that can no longer appear in any PR's check set.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# See ci.yml for the full UTF-8 rationale (self-hosted runner resolves its
# text layer from the Windows ANSI codepage, not UTF-8, without this).
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8:surrogateescape"

# Least-privilege default (same rationale as ci.yml): checkout needs
# contents: read and nothing here needs more.
permissions:
  contents: read

jobs:
  AttachmentContracts:
    name: Attachment Contracts (shadow)
    # `light`: this job is a single fast tree scan, not the pytest suite, so
    # it belongs on the label every cw listener carries rather than the
    # 2-slot `suite` semaphore ci.yml's Tests job depends on (see that job's
    # header for why `suite` exists and why Lint-weight jobs stay off it).
    runs-on: [self-hosted, Windows, X64, light]
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 (full history) is required so `--base-ref` below can
      # `git show <base>:.attachment-budgets.json` -- the diff-based
      # ratchet-tamper guard (round-1 review finding #1: raise-to-match
      # laundering) needs the PREVIOUS commit's baseline as an independent
      # reference point, which a shallow clone would not have.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # setup-uv@v7 replaced with a PATH-append (#1115): the action's runner
      # Node process crashed twice in 12 min with a libuv assertion
      # (async.c:94, upstream flake class) on this box, and on a self-hosted
      # runner the action's only real job -- downloading uv -- is unnecessary:
      # the tool cache and the host both already have it. Resolution order:
      # newest uv in the runner tool cache (what setup-uv itself installed),
      # else host uv on PATH, else fail loudly -- never silently download.
      - name: Add uv to PATH (self-hosted, no setup-uv)
        shell: bash
        run: |
          set -e
          cache="$RUNNER_TOOL_CACHE/uv"
          dir=""
          if [ -d "$cache" ]; then
            ver=$(ls "$cache" | grep -E '^[0-9]+[.][0-9]+[.][0-9]+$' | sort -V | tail -1)
            [ -n "$ver" ] && dir="$cache/$ver/x64"
          fi
          if [ -n "$dir" ] && [ -x "$dir/uv.exe" ]; then
            echo "$dir" >> "$GITHUB_PATH"
            "$dir/uv.exe" --version
          elif command -v uv >/dev/null; then
            uv --version
          else
            echo "::error::uv not found in tool cache ($cache) or host PATH; install uv on the host"
            exit 1
          fi
      # ci-fleet resolves from PyPI (versioned wheel in uv.lock) since
      # 2026-08-28 -- see ci.yml for the note on the removed sibling-checkout
      # step.
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      # Week-1 SHADOW mode: --report-only makes check-tree exit 0
      # unconditionally regardless of findings, so this step can never fail
      # the job -- it only surfaces annotations + a step summary for humans
      # to read while the baseline settles.
      # WEEK-2: flip to enforcement by deleting `--report-only` below (the
      # exit-code logic in check.py / __main__.py already supports it
      # unconditionally: `return 1 if blocking else 0`). No other change is
      # required -- the job stops being informational and starts blocking
      # merges the moment that flag is removed.
      - name: Check tree (report-only)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          else
            base_ref="${{ github.event.before }}"
          fi
          uv run python -m charlie_work.attachment_contracts check-tree \
            --report-only --github-annotations --base-ref "$base_ref"
