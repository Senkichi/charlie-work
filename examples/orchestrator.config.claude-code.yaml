# charlie-work config — Claude-Code-workers profile.
# Copy to your repo root as `orchestrator.config.yaml` and adjust.

labels:
  ready: automated-ready

dispatch:
  # Each unit of default_limit is one LOCAL worker (its own worktree + claude -p
  # + test run) on THIS host — unlike the Devin adapters, which run in the
  # cloud. Total host load ≈ default_limit × the suite's xdist worker count, so
  # keep that product near your physical core count and bound the consumer
  # suite's `-n` (don't let it inherit `-n auto`). See RUNBOOK.md
  # "Local host saturation ceiling (claude-code adapter)".
  default_limit: 3
  branch_prefix: agent/issue
  worker_model_tier: capable
  # Claude Code workers use the direct-shell loop (no Devin session skills).
  worker_template: worker_claude_code.md
  # Dispatch order: "oldest" (default) or "newest" (previous behavior)
  # order: oldest

review:
  # Escalates to agent:human-needed past this many request_changes cycles.
  max_rework_cycles: 2
  require_tests_or_rationale: true
  require_issue_link: true

review_dispatch:
  # Issue #370: launch Claude Code reviewers concurrently for queued PRs that
  # have a current review packet and no verdict. The reviewer agent makes the
  # approve/request_changes/blocked decision via `charlie verdict`.
  enabled: false
  # Directory for reviewer sidecar JSON + logs. MUST be distinct from
  # devin.sessions_dir so worker concurrency accounting is not poisoned by
  # reviewer processes.
  reviews_dir: .var/charlie-work/dispatches/reviews
  # Local-only process bound. 0 means unlimited; raise only if local CPU/disk
  # from concurrent reviewer worktrees becomes a visible bottleneck.
  max_local_review_processes: 0

auto_merge:
  enabled: true
  strategy: squash
  # Deletion is remote-only and best-effort — safe with local worktrees
  # (the failure mode that forced delete_branch:false in empericus is fixed).
  delete_branch: true
  require_approved_review: true
  # MUST match the check-run names GitHub reports for your CI
  # (see the job `name:` fields in .github/workflows/*.yml).
  # `charlie doctor` verifies these against your workflows.
  required_checks:
    - Test
    - "Lint, Types & Pre-commit"
  # Extra flags appended to the `gh pr merge` invocation. Takes precedence
  # over the legacy `admin` field. Use this for protected-base merges
  # (e.g., ["--admin"] when your gh auth has admin on the repo) or
  # merge-queue/auto-merge flows (e.g., ["--auto"]). Flags must start with
  # "--" and cannot be strategy flags (--merge/--rebase/--squash) or
  # --delete-branch (branch deletion is handled separately).
  # merge_flags: ["--admin"]

runtime:
  state_dir: .var/charlie-work
  # Repo-local templates override package templates by filename. Point this at
  # a tracked dir holding your specialized worker prompt (repo invariants,
  # canonical commands) — see the empericus setup for the pattern.
  # prompts_dir: orchestrator-prompts
  # Bounded retry for transient GitHub API failures (TLS blips, connection
  # drops, gateway 5xx, secondary rate limits). Mutating commands are only
  # retried on provable pre-connection errors to preserve at-most-once semantics.
  # gh_max_retries: 3
  # gh_retry_base_seconds: 1.0

devin:
  # claude-code launches each worker headless in an isolated git worktree.
  # Each worker cold-builds its own per-worktree `.venv` by default (issue
  # #274); set `claude_code.venv_source` to a path only if you want to opt
  # back into the shared-venv junction. Verify with `charlie doctor
  # --adapter-probe`. Fall back to `adapter: manual` to paste prompts by hand.
  adapter: claude-code
  session_manifest: .var/charlie-work/dispatches/session-manifest.json
  session_results: .var/charlie-work/dispatches/session-results.json
  sessions_dir: .var/charlie-work/dispatches/sessions

claude_code:
  # Launch command; empty uses the built-in default shown here. The rendered
  # worker prompt is fed via stdin unless the command names {prompt_path}.
  # command: [claude, -p, --permission-mode, acceptEdits]
  # Worktrees live under .var/charlie-work/worktrees unless overridden.
  # worktrees_dir: .var/charlie-work/worktrees
  # Disabled by default (issue #274): a claude-code worker has a full agentic
  # shell and can run uv sync, which would rewrite the shared venv's editable
  # install metadata. Set to a path to re-enable the legacy shared-venv
  # junction; set to null to keep it disabled.
  venv_source: null
  # Extra env merged over the orchestrator's env in every worker process. Each
  # claude-code worker runs LOCALLY on this host, so a default_limit-wide wave
  # stacks K test runs here. PYTEST_XDIST_AUTO_NUM_WORKERS caps `pytest -n auto`
  # at the launch boundary (xdist reads it when resolving `-n auto`/`-n logical`)
  # so the fleet doesn't oversubscribe cores into swap — WITHOUT touching the
  # suite's pyproject addopts, so CI (which never sees this var) keeps full
  # parallelism. "2" is a starting point for a ~6-8 core box; raise/lower so
  # default_limit x value ~= your physical cores. Only bounds `-n auto`/
  # `-n logical` (not an explicit `-n N`). See RUNBOOK.md
  # "Local host saturation ceiling (claude-code adapter)".
  worker_env:
    PYTEST_XDIST_AUTO_NUM_WORKERS: "2"

# cross_family omitted → disabled (Claude-only review).
