# charlie-work config — Devin-workers profile (the default runtime).
# Copy to your repo root as `orchestrator.config.yaml` and adjust.

labels:
  ready: automated-ready

dispatch:
  default_limit: 3
  branch_prefix: agent/issue
  worker_model_tier: capable
  # Devin worker sessions use the skills-based loop.
  worker_template: worker.md
  # Dispatch order: "oldest" (default) or "newest" (previous behavior)
  # order: oldest

review:
  # Past this many request_changes cycles the PR escalates to
  # agent:human-needed instead of another rework dispatch — iteration past
  # ~2 rounds thrashes (wrong brief or unimplementable criteria).
  max_rework_cycles: 2
  require_tests_or_rationale: true
  require_issue_link: true

auto_merge:
  enabled: true
  strategy: squash
  # Post-merge REMOTE branch deletion is best-effort and never aborts the
  # merge/label sequence. Safe to keep true even with local worktree checkouts.
  delete_branch: true
  require_approved_review: true
  # MUST match the check-run names GitHub reports for your CI
  # (see the job `name:` fields in .github/workflows/*.yml).
  # `charlie doctor` verifies these against your workflows.
  required_checks:
    - Tests passed
    - Lint & Format
    - Pre-commit
  # Extra flags appended to the `gh pr merge` invocation. Takes precedence
  # over the legacy `admin` field. Use this for protected-base merges
  # (e.g., ["--admin"] when your gh auth has admin on the repo) or
  # merge-queue/auto-merge flows (e.g., ["--auto"]). Flags must start with
  # "--" and cannot be strategy flags (--merge/--rebase/--squash) or
  # --delete-branch (branch deletion is handled separately).
  # merge_flags: ["--admin"]

runtime:
  state_dir: .var/charlie-work
  # Optional repo-local template dir; files here override the package
  # templates by filename (e.g. drop in your own worker.md).
  # prompts_dir: orchestrator-prompts

devin:
  # devin-shell launches headless `devin` CLI sessions per issue, non-blocking,
  # with sidecar JSON + per-session logs under sessions_dir. Each worker runs
  # in an isolated per-issue git worktree so concurrent sessions do not fight
  # over the shared checkout. Verify with `charlie doctor --adapter-probe`
  # before the first wave. Fall back to `adapter: manual` (operator pastes
  # prompts from the session manifest) if the devin CLI is unavailable.
  adapter: devin-shell
  session_manifest: .var/charlie-work/dispatches/session-manifest.json
  session_results: .var/charlie-work/dispatches/session-results.json
  sessions_dir: .var/charlie-work/dispatches/sessions
  # Worker model for devin-shell sessions; empty string means CLI default
  # (currently claude-opus-4-8-medium, the premium tier). Set to a specific
  # model name (e.g. "claude-sonnet-4-5") to control cost. The rendered command
  # will include "--model <value>" when set. Run `charlie doctor` to verify the
  # effective model before dispatching.
  worker_model: ""
  # Launch command override; empty uses the built-in default (shown below).
  # Placeholders: {prompt_path} {issue_number} {branch} {model_args}. A list runs without a
  # shell. --permission-mode dangerous is required for headless workers; without
  # it the Devin CLI defaults to auto (read-only tools) and stalls on git/uv/gh.
  # The {model_args} placeholder is replaced with "--model <worker_model>" when
  # worker_model is set, or an empty string when unset (CLI default).
  # shell_command: [devin, --prompt-file, "{prompt_path}", --print, --permission-mode, dangerous]
  # A blocking alternative is adapter: command with dispatch_command +
  # command_timeout_seconds (one blocking launcher call per issue).

cross_family:
  # Auto adversarial pass by a NON-Claude model (codex via the Devin CLI) on
  # every non-draft PR `why-charlie-hate` and on-demand `why-charlie-hate-spec`. Findings are
  # LEADS, not verdicts (the model over-escalates severity) and never gate a
  # merge. Set `enabled: false` (or delete this block) to revert to
  # Claude-only review.
  enabled: true
  model: codex
  # {model} and {prompt_path} are substituted at run time. A list runs without a shell.
  command:
    - devin
    - --model
    - "{model}"
    - -p
    - --prompt-file
    - "{prompt_path}"
  timeout_seconds: 300
