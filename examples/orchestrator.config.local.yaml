# charlie-work config — local-file issue source, Claude-Code-workers profile.
# Copy to your repo root as `orchestrator.config.yaml` and adjust.
#
# For a repo with NO GitHub remote: issues are markdown files under
# local_issues.issues_dir instead of GitHub issues (local_issues.py /
# local_issue_files.py). The GitHub-API surface is a null object here —
# reads answer empty, writes fail as values — but review and merge are NOT
# dead ends: with review_dispatch + auto_merge enabled (both default on for
# local repos) the supervisor runs a local lane per finished ticket —
# reviewer diff against the base branch, base sync + full suite in the
# branch worktree, then a fast-forward (or --no-ff) merge of the base
# branch — all without an operator gate. See
# README.md#local-file-issue-source for the full mechanism.

local_issues:
  enabled: true
  # Relative to the repo root. One file per issue: NNN_*.md, YAML
  # frontmatter (title/state/labels/…) + body. Non-recursive scan.
  issues_dir: docs/issues

labels:
  ready: automated-ready

dispatch:
  # Each unit of default_limit is one LOCAL worker (its own worktree + claude -p
  # + test run) on THIS host — unlike the Devin adapters, which run in the
  # cloud. Total host load ≈ default_limit × the suite's xdist worker count, so
  # keep that product near your physical core count and bound the consumer
  # suite's `-n` (don't let it inherit `-n auto`). See RUNBOOK.md
  # "Local host saturation ceiling (claude-code adapter)".
  default_limit: 3
  # Issue #1843: host-load backoff -- before launching a worker, the dispatch
  # governor counts processes inside live pytest process trees on this host
  # and defers the launch while the count exceeds this threshold. Default is
  # the host's logical CPU count (on by default); set 0 to disable.
  # host_load_max_pytest_processes: 16
  # Per-pass cap for merge-finalization of merged-PR-referenced closed issues
  # (stale ready-label cleanup). Irrelevant here (no PRs) but harmless — 0
  # disables finalization outright if you'd rather make that explicit.
  finalize_limit: 25
  branch_prefix: agent/issue
  # No worker_template/rework_template set here deliberately:
  # local_issues.enabled above re-defaults them to worker_local.md /
  # rework_local.md automatically (config.load_config) — commit-only, no
  # push, no PR, and rework loops back through the local review lane. Set
  # these explicitly only to override the defaults with your own repo-local
  # templates.
  # worker_template: worker_claude_code.md
  # rework_template: rework.md
  # Runner prefix for templates that render a test command (worker.md,
  # worker_claude_code.md, rework.md); the prompt adds the impacted test files
  # and "-q --tb=short". Also used as the full-suite command at the local
  # merge gate (the suite runs in the updated branch worktree before the
  # base branch is advanced). No effect under the default worker_local.md,
  # which tells the worker to use the repo's own documented test command.
  # test_command: uv run --directory server pytest
  # Dispatch order: "oldest" (default) or "newest" (previous behavior)
  # order: oldest

review:
  # Escalates to agent:human-needed past this many request_changes cycles —
  # applies to the local review lane as well (a local reviewer verdict is
  # required before the base branch is advanced).
  max_rework_cycles: 2
  require_tests_or_rationale: true
  require_issue_link: true

review_dispatch:
  # For local repos this is ON by default (config.load_config re-defaults it
  # when local_issues.enabled is true and the key is absent) and drives the
  # local review lane: a reviewer session inspects `git diff <base>...<branch>`
  # in a read-only checkout, exactly like the remote lane inspects a PR diff.
  # Verdicts reuse the remote vocabulary (approved / request_changes /
  # blocked) and labels. Set enabled: false only as a kill switch — parked
  # branches then wait for a human to review and merge them by hand.
  enabled: true
  reviews_dir: .var/charlie-work/dispatches/reviews
  # Per-host bound on concurrent local reviewer processes (0 = unlimited).
  # Reviewers run on THIS host next to the workers — keep this small.
  max_local_review_processes: 2

auto_merge:
  # For local repos this drives the local merge gate: once a reviewer
  # approves, the current base is merged into the branch worktree, the full
  # suite runs there, and on green the base branch is fast-forwarded (or
  # merged with --no-ff when it has diverged) — no operator action. Set
  # enabled: false to keep the approve-by-reviewer step but land merges by
  # hand. Conflicts and suite failures route back through the rework lane
  # automatically.
  enabled: true
  # strategy/delete_branch/required_checks are GitHub-PR mechanics — no-ops
  # for the local lane, which always merges the head branch as-is.
  strategy: squash
  delete_branch: true
  require_approved_review: true
  # MUST match the check-run names GitHub reports for your CI. Irrelevant
  # here (no CI integration for local repos; the local lane runs the full
  # suite directly instead of polling check runs) — kept for parity with
  # the other shipped profiles.
  required_checks:
    - Test
    - "Lint, Types & Pre-commit"
    - "Collect-only gate"

runtime:
  state_dir: .var/charlie-work
  # Repo-local templates override package templates by filename. Point this at
  # a tracked dir holding your specialized worker prompt (repo invariants,
  # canonical commands) — see the empericus setup for the pattern.
  # prompts_dir: orchestrator-prompts

worker:
  # claude-code launches each worker headless in an isolated git worktree.
  # Fall back to harness: manual to paste prompts from the session manifest
  # by hand if the claude CLI is unavailable.
  harness: claude-code

reviewer:
  # Harness for the local-lane reviewer sessions (claude-code runs them
  # headless in read-only checkouts on this host).
  harness: claude-code

devin:
  # Each worker cold-builds its own per-worktree `.venv` by default (issue
  # #274); set claude_code.venv_source to a path only if you want to opt back
  # into the shared-venv junction. Verify with `charlie doctor
  # --adapter-probe` before the first wave.
  session_manifest: .var/charlie-work/dispatches/session-manifest.json
  session_results: .var/charlie-work/dispatches/session-results.json
  sessions_dir: .var/charlie-work/dispatches/sessions

claude_code:
  # Worktrees live under .var/charlie-work/worktrees unless overridden.
  # worktrees_dir: .var/charlie-work/worktrees
  # Disabled by default (issue #274): a claude-code worker has a full agentic
  # shell and can run uv sync, which would rewrite the shared venv's editable
  # install metadata. Set to a path to re-enable the legacy shared-venv
  # junction; set to null to keep it disabled.
  venv_source: null
  # Extra env merged over the orchestrator's env in every worker process. Each
  # claude-code worker runs LOCALLY on this host, so a default_limit-wide wave
  # stacks K test runs here. PYTEST_XDIST_AUTO_NUM_WORKERS caps `pytest -n auto`
  # at the launch boundary so the fleet doesn't oversubscribe cores into swap.
  # "2" is a starting point for a ~6-8 core box; raise/lower so default_limit
  # x value ~= your physical cores. See RUNBOOK.md "Local host saturation
  # ceiling (claude-code adapter)".
  worker_env:
    PYTEST_XDIST_AUTO_NUM_WORKERS: "2"

supervisor:
  # Foreground poll/sleep loop used by `charlie bash-rats` (per-repo) and
  # `charlie fleet supervise` (fleet-wide). All four fields below apply to both.
  poll_interval_seconds: 20
  full_pass_interval_seconds: 300
  active_cooldown_seconds: 30
  max_runtime_minutes: 0
