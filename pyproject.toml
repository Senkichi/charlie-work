[project]
name = "devin-orchestrator"
version = "0.1.0"
description = "Deterministic GitHub-issue orchestrator for AI worker fleets — Devin workers by default, Claude Code workers first-class"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.scripts]
devin-orch = "devin_orchestrator.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devin_orchestrator"]

[tool.pytest.ini_options]
addopts = "-q --tb=short"
testpaths = ["tests"]

[tool.ruff]
line-length = 99
src = ["src", "tests"]
