[project]
name = "charlie-work"
version = "0.1.0"
description = "Deterministic GitHub-issue orchestrator for AI worker fleets — Devin workers by default, Claude Code workers first-class"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "psutil>=5.9",
    "tzdata>=2026.3",
    "ci-fleet",
]

[project.scripts]
# `charlie` is the hero command; `charlie-work` is a formal alias to the same entry point.
charlie = "charlie_work.cli:main"
charlie-work = "charlie_work.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.6", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charlie_work"]

[tool.pytest.ini_options]
addopts = "-q --tb=short"
testpaths = ["tests"]
markers = [
    "real_activity_probe_live: test exercises the real (unstubbed) real_activity_probe_for instead of the autouse stale-probe stub (issue #307)",
]

[tool.ruff]
line-length = 99
src = ["src", "tests"]
# Frozen reference copies from the archived freecode repo — docs, not live code.
extend-exclude = ["docs/freecode-salvage/reference"]

[tool.uv.sources]
ci-fleet = { path = "../ci_runners", editable = true }
